<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produits</title>
</head>
<body>
    <header>
        <h1>Shop Mali</h1>
        <h2>Gestion des produits</h2>
    </header>
    <main>
        <!-- Formulaire pour ajouter un produit -->
        <form id="produitForm">
            <!-- Champs du formulaire pour ajouter un produit -->
            <label for="nom">Nom du produit</label>
            <input type="text" id="nom" name="nom" required> <br>
            
            <label for="categorie">Catégorie</label>
            <select id="categorie" name="categorie" required>
                <option value="">Sélectionnez une catégorie</option>
                <option value="électronique">Électronique</option>
                <option value="vêtements">Vêtements</option>
                <option value="boissons">Boissons</option>
                <option value="hygiène">Hygiène</option>
                <option value="alimentation">Alimentation</option>
                <option value="Autre">Autre</option>
            </select> <br>

            <label for="prix_achat">Prix d'achat</label>
            <input type="number" id="prix_achat" name="prix_achat" step="0.01" required> <br> <!-- step="0.01" permet d'accepter les décimales pour le prix d'achat -->

            <label for="prix_vente">Prix de vente</label>
            <input type="number" id="prix_vente" name="prix_vente" step="0.01" required > <br>

            <label for="quantite">Quantité</label>
            <input type="number" id="quantite" name="quantite" min="0" required > <br>

            <label for="stock">Stock minimum</label>
            <input type="number" id="stock" name="stock" min="0" required> <br>

            <button type="submit">Ajouter le produit</button> <br>

           
        </form>

        <section>
            <label for="recherche">Rechercher un produit</label>
            <input type="search" id="recherche" name="recherche" placeholder="Rechercher un produit...">
        </section>

        <!-- tableau pour afficher les produits -->

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Catégorie</th>
                    <th>Prix d'achat</th>
                    <th>Prix de vente</th>
                    <th>Quantité</th>
                    <th>Stock minimum</th>
                    <th>Statut</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="produitsTableBody">
                <!-- Les produits seront ajoutés ici dynamiquement -->
                <tr>
                    <td>1</td>
                    <td>Produit 1</td>
                    <td>Électronique</td>
                    <td>100.00</td>
                    <td>150.00</td>
                    <td>10</td>
                    <td>5</td>
                    <td>En stock</td>
                    <td>    
                        <button type="button" >Modifier </button>
                        <button type="button" >Supprimer </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
    
</body>
</html>
