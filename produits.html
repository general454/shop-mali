<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="css/style.css">
    <title>Produits</title>
</head>

<body>
    <header>
        <h1>Shop Mali</h1>
        <h2>Gestion des produits</h2>
    </header>
    <main>
        <!-- Formulaire pour ajouter un produit -->
        <form id="produitForm">
            <!-- Champs du formulaire pour ajouter un produit -->
            <div class="form-group">
                <label for="nom">Nom du produit</label>
                <input type="text" id="nom" name="nom" required placeholder="Ex: Laptop">
            </div>

            <div class="form-group">
                <label for="categorie">Catégorie</label>
                <select id="categorie" name="categorie" required>
                    <option value="">Sélectionnez une catégorie</option>
                    <option value="électronique">Électronique</option>
                    <option value="vêtements">Vêtements</option>
                    <option value="boissons">Boissons</option>
                    <option value="hygiène">Hygiène</option>
                    <option value="alimentation">Alimentation</option>
                    <option value="Autre">Autre</option>
                </select>
            </div>

            <div class="form-group">
                <label for="prix_achat">Prix d'achat</label>
                <input type="number" id="prix_achat" name="prix_achat" step="0.01" required placeholder="Ex: 1000.00"> <!-- step="0.01" permet d'accepter les décimales pour le prix d'achat -->
            </div>

            <div class="form-group">
                <label for="prix_vente">Prix de vente</label>
                <input type="number" id="prix_vente" name="prix_vente" step="0.01" required placeholder="Ex: 1500.00">
            </div>

            <div class="form-group">
                <label for="quantite">Quantité</label>
                <input type="number" id="quantite" name="quantite" min="0" required placeholder="Ex: 10">
            </div>

            <div class="form-group">
                <label for="stock">Stock minimum</label>
                <input type="number" id="stock" name="stock" min="0" required placeholder="Ex: 5">
            </div>

            <div class="form-actions">
                <button type="submit">Ajouter le produit</button>
                <button type="button" id="btnAnnuler" class="btn-annuler" hidden>Annuler</button>
            </div>
        </form>

        <section class="recherche-section">
            <label for="recherche">Rechercher un produit</label>
            <input type="search" id="recherche" name="recherche" placeholder="Rechercher un produit...">
        </section>

        <!-- tableau pour afficher les produits -->
      <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Catégorie</th>
                    <th>Prix d'achat</th>
                    <th>Prix de vente</th>
                    <th>Quantité</th>
                    <th>Stock minimum</th>
                    <th>Statut</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="produitsTableBody">
                <!-- Les produits seront ajoutés ici dynamiquement -->
                <!--
                Exemple de ligne générée en JS, avec badge de statut et boutons accessibles :

                <tr>
                    <td>1</td>
                    <td>Riz</td>
                    <td>boissons</td>
                    <td>5000</td>
                    <td>5500</td>
                    <td>20</td>
                    <td>5</td>
                    <td><span class="badge badge-instock">En stock</span></td>
                    <td class="actions-cell">
                        <button class="btn-modifier" aria-label="Modifier Riz">Modifier</button>
                        <button class="btn-supprimer" aria-label="Supprimer Riz">Supprimer</button>
                    </td>
                </tr>
                -->
            </tbody>
        </table>
      </div>
    </main>
<script src="js/produits.js"></script>
</body>
</html>
